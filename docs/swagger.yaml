      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新班级信息
      tags:
      - 班级
  /clazzes/{clazzId}:
