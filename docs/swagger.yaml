  /ws/submit/{id}:
    get:
      description: 建立WebSocket连接以实时接收提交状态更新。支持心跳机制和自动重连。
      parameters:
      - description: 提交ID
        in: path
        name: id
        required: true
        type: string
      - description: 访问令牌（可选，也可通过Authorization header传递）
        in: query
        name: token
        type: string
      - description: Bearer token
        in: header
        name: Authorization
        type: string
      responses:
        "101":
          description: WebSocket连接建立，后续通过WebSocket发送实时状态更新
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.WSMessage'
        "400":
          description: 无效的提交ID或请求
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
        "401":
          description: 需要登录
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
        "404":
          description: 提交不存在
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 提交状态WebSocket连接
      tags:
      - WebSocket
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
