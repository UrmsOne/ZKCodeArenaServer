basePath: /api/v1
definitions:
  models.AddClazzMemberRequest:
    properties:
      clazz_id:
        type: string
      member_id:
        type: string
    required:
    - clazz_id
    - member_id
    type: object
  models.AddClazzTeachersRequest:
    properties:
      clazz_id:
        type: string
      teacher_ids:
        items:
          type: string
        type: array
    required:
    - clazz_id
    - teacher_ids
    type: object
  models.AddCourseTeachersRequest:
    properties:
      course_id:
        type: string
      teacher_ids:
        items:
          type: string
        type: array
    required:
    - course_id
    - teacher_ids
    type: object
  models.AddTaskRequest:
    properties:
      clazz_id:
        type: string
      course_id:
        type: string
      description:
        type: string
      end_time:
        description: 如果不设置则没有结束时间
        type: string
      relation_ids:
        items:
          type: string
        type: array
      start_time:
        description: 必须设置开始时间
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/models.TaskType'
    required:
    - clazz_id
    - course_id
    - start_time
    - title
    - type
    type: object
  models.BatchCreateTestCasesRequest:
    properties:
      problem_id:
        type: string
      test_cases:
        items:
          $ref: '#/definitions/models.TestCase'
        minItems: 1
        type: array
    required:
    - problem_id
    - test_cases
    type: object
  models.CourseStatus:
    enum:
    - 0
    - 1
    - 2
    format: int32
    type: integer
    x-enum-comments:
      CourseStatusActive: 活跃
      CourseStatusArchived: 已归档
      CourseStatusDraft: 草稿
    x-enum-descriptions:
    - 草稿
    - 活跃
    - 已归档
    x-enum-varnames:
    - CourseStatusDraft
    - CourseStatusActive
    - CourseStatusArchived
  models.CreateClazzRequest:
    properties:
      course_id:
        type: string
      description:
        type: string
      max_members:
        type: integer
      name:
        type: string
      require_invite:
        type: boolean
      schedule:
        type: string
    required:
    - course_id
    - name
    - require_invite
    type: object
  models.CreateCourseRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  models.CreateProblemRequest:
    properties:
      author:
        type: string
      description:
        minLength: 10
        type: string
      difficulty:
        allOf:
        - $ref: '#/definitions/models.ProblemDifficulty'
        description: 难度和标签（必填）
        enum:
        - easy
        - medium
        - hard
      hint:
        type: string
      input:
        description: 题目详情（可选）
        type: string
      is_public:
        description: 可选，默认false
        type: boolean
      memory_limit:
        description: 默认256MB
        maximum: 1024
        minimum: 32
        type: integer
      output:
        type: string
      sample_input:
        type: string
      sample_output:
        type: string
      source:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.ProblemStatus'
        description: 状态控制（可选）
        enum:
        - draft
        - published
        - archived
      tags:
        items:
          type: string
        maxItems: 10
        type: array
      time_limit:
        description: 限制条件（可选，有默认值）
        maximum: 10000
        minimum: 100
        type: integer
      title:
        description: 基本信息（必填）
        maxLength: 200
        minLength: 1
        type: string
    required:
    - description
    - difficulty
    - title
    type: object
  models.CreateTestCaseRequest:
    properties:
      input:
        type: string
      is_sample:
        type: boolean
      memory_limit:
        description: 可选的内存限制（MB）
        type: integer
      output:
        type: string
      problem_id:
        type: string
      score:
        description: 用例分数
        type: integer
      time_limit:
        description: 可选的超时配置（ms）
        type: integer
    required:
    - input
    - output
    - problem_id
    type: object
  models.FinishTaskRequest:
    properties:
      clazz_id:
        type: string
      relation_id:
        type: string
      task_id:
        type: string
    required:
    - clazz_id
    - relation_id
    - task_id
    type: object
  models.JudgeResult:
    properties:
      compile_error:
        description: 编译错误信息
        type: string
      memory_used:
        description: 内存使用(KB)
        type: integer
      runtime_error:
        description: 运行时错误信息
        type: string
      status:
        $ref: '#/definitions/models.SubmitStatus'
      test_results:
        description: 测试用例结果
        items:
          $ref: '#/definitions/models.TestResult'
        type: array
      time_used:
        description: 时间使用(ms)
        type: integer
    type: object
  models.Language:
    enum:
    - c
    - cpp
    - java
    - python
    - go
    type: string
    x-enum-varnames:
    - LangC
    - LangCpp
    - LangJava
    - LangPython
    - LangGo
  models.LoginRequest:
    properties:
      password:
        type: string
      student_id:
        type: string
    required:
    - password
    - student_id
    type: object
  models.PageQueryCourseRequest:
    properties:
      name:
        type: string
      page_num:
        type: integer
      page_size:
        type: integer
      status:
        type: integer
    type: object
  models.PageQueryTeacherCoursesRequest:
    properties:
      name:
        type: string
      page_num:
        type: integer
      page_size:
        type: integer
      status:
        type: integer
    type: object
  models.Problem:
    properties:
      ac_count:
        description: AC 次数
        type: integer
      author:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      difficulty:
        $ref: '#/definitions/models.ProblemDifficulty'
      hint:
        type: string
      id:
        type: string
      input:
        type: string
      is_public:
        type: boolean
      memory_limit:
        description: 内存限制(MB)
        type: integer
      output:
        type: string
      sample_input:
        type: string
      sample_output:
        type: string
      source:
        type: string
      status:
        $ref: '#/definitions/models.ProblemStatus'
      submit_count:
        description: 提交次数
        type: integer
      tags:
        items:
          type: string
        type: array
      time_limit:
        description: 时间限制(ms)
        type: integer
      title:
        type: string
      updated_at:
        type: string
    required:
    - description
    - title
    type: object
  models.ProblemDifficulty:
    enum:
    - easy
    - medium
    - hard
    type: string
    x-enum-comments:
      DifficultyEasy: 简单
      DifficultyHard: 困难
      DifficultyMedium: 中等
    x-enum-descriptions:
    - 简单
    - 中等
    - 困难
    x-enum-varnames:
    - DifficultyEasy
    - DifficultyMedium
    - DifficultyHard
  models.ProblemStatus:
    enum:
    - draft
    - published
    - archived
    type: string
    x-enum-comments:
      StatusArchived: 已归档
      StatusDraft: 草稿
      StatusPublished: 已发布
    x-enum-descriptions:
    - 草稿
    - 已发布
    - 已归档
    x-enum-varnames:
    - StatusDraft
    - StatusPublished
    - StatusArchived
  models.RemoveClazzMembersRequest:
    properties:
      clazz_id:
        type: string
      member_ids:
        items:
          type: string
        type: array
    required:
    - clazz_id
    - member_ids
    type: object
  models.RemoveClazzTeachersRequest:
    properties:
      clazz_id:
        type: string
      teacher_ids:
        items:
          type: string
        type: array
    required:
    - clazz_id
    - teacher_ids
    type: object
  models.RemoveCourseTeachersRequest:
    properties:
      course_id:
        type: string
      teacher_ids:
        items:
          type: string
        type: array
    required:
    - course_id
    - teacher_ids
    type: object
  models.Submit:
    properties:
      code:
        type: string
      created_at:
        type: string
      id:
        type: string
      language:
        $ref: '#/definitions/models.Language'
      problem_id:
        type: string
      result:
        $ref: '#/definitions/models.JudgeResult'
      status:
        $ref: '#/definitions/models.SubmitStatus'
      updated_at:
        type: string
      user_id:
        type: string
    required:
    - code
    - language
    - problem_id
    - user_id
    type: object
  models.SubmitCodeRequest:
    properties:
      code:
        type: string
      language:
        type: string
      problem_id:
        type: string
    required:
    - code
    - language
    - problem_id
    type: object
  models.SubmitStatus:
    enum:
    - pending
    - running
    - accepted
    - wrong_answer
    - time_limit
    - memory_limit
    - runtime_error
    - compile_error
    - system_error
    type: string
    x-enum-comments:
      StatusAccepted: 通过
      StatusCompileError: 编译错误
      StatusMemoryLimit: 内存超限
      StatusPending: 等待中
      StatusRunning: 运行中
      StatusRuntimeError: 运行时错误
      StatusSystemError: 系统错误
      StatusTimeLimit: 超时
      StatusWrongAnswer: 答案错误
    x-enum-descriptions:
    - 等待中
    - 运行中
    - 通过
    - 答案错误
    - 超时
    - 内存超限
    - 运行时错误
    - 编译错误
    - 系统错误
    x-enum-varnames:
    - StatusPending
    - StatusRunning
    - StatusAccepted
    - StatusWrongAnswer
    - StatusTimeLimit
    - StatusMemoryLimit
    - StatusRuntimeError
    - StatusCompileError
    - StatusSystemError
  models.TaskType:
    enum:
    - 1
    - 2
    format: int32
    type: integer
    x-enum-comments:
      TaskTypeProblem: 题单
      TaskTypeVideo: 视频
    x-enum-descriptions:
    - 题单
    - 视频
    x-enum-varnames:
    - TaskTypeProblem
    - TaskTypeVideo
  models.TestCase:
    properties:
      created_at:
        type: string
      id:
        type: string
      input:
        type: string
      is_sample:
        type: boolean
      memory_limit:
        description: 内存限制(MB)，可选
        type: integer
      output:
        type: string
      problem_id:
        type: string
      score:
        description: 用例分数（可选，用于部分分）
        type: integer
      time_limit:
        description: 可选的超时配置（优先级高于题目默认配置）
        type: integer
    type: object
  models.TestResult:
    properties:
      error:
        description: 错误信息
        type: string
      expected:
        description: 期望输出
        type: string
      is_sample:
        description: 是否为示例用例（用于判断是否返回详细信息）
        type: boolean
      memory_used:
        description: KB
        type: integer
      output:
        description: 仅示例用例返回以下字段（隐藏用例不返回详细输出）
        type: string
      status:
        $ref: '#/definitions/models.SubmitStatus'
      test_case_id:
        type: string
      time_used:
        description: ms
        type: integer
    type: object
  models.UpdateClazzRequest:
    properties:
      clazz_id:
        type: string
      description:
        type: string
      max_members:
        type: integer
      name:
        type: string
      require_invite:
        type: boolean
      schedule:
        type: string
    required:
    - clazz_id
    type: object
  models.UpdateCourseRequest:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        $ref: '#/definitions/models.CourseStatus'
    required:
    - id
    type: object
  models.UpdateProblemRequest:
    properties:
      author:
        type: string
      description:
        minLength: 10
        type: string
      difficulty:
        allOf:
        - $ref: '#/definitions/models.ProblemDifficulty'
        description: 难度和标签（可选）
        enum:
        - easy
        - medium
        - hard
      hint:
        type: string
      input:
        description: 题目详情（可选）
        type: string
      is_public:
        type: boolean
      memory_limit:
        maximum: 1024
        minimum: 32
        type: integer
      output:
        type: string
      sample_input:
        type: string
      sample_output:
        type: string
      source:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.ProblemStatus'
        description: 状态控制（可选）
        enum:
        - draft
        - published
        - archived
      tags:
        items:
          type: string
        maxItems: 10
        type: array
      time_limit:
        description: 限制条件（可选）
        maximum: 10000
        minimum: 100
        type: integer
      title:
        description: 基本信息（可选）
        maxLength: 200
        minLength: 1
        type: string
    type: object
  models.UpdateTaskRequest:
    properties:
      clazz_id:
        type: string
      course_id:
        type: string
      description:
        type: string
      end_time:
        type: string
      relation_ids:
        items:
          type: string
        type: array
      start_time:
        type: string
      task_id:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/models.TaskType'
    required:
    - clazz_id
    - course_id
    - task_id
    type: object
  models.UpdateTestCaseRequest:
    properties:
      input:
        type: string
      is_sample:
        type: boolean
      memory_limit:
        type: integer
      output:
        type: string
      score:
        type: integer
      time_limit:
        type: integer
    type: object
  models.UpdateUserRequest:
    properties:
      is_active:
        type: boolean
      role:
        type: string
    type: object
  models.User:
    properties:
      avatar:
        type: string
      bio:
        type: string
      class:
        type: string
      created_at:
        type: string
      email:
        type: string
      grade:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_login_at:
        type: string
      major:
        type: string
      password:
        type: string
      phone:
        type: string
      real_name:
        type: string
      role:
        $ref: '#/definitions/models.UserRole'
      school:
        type: string
      student_id:
        type: string
      updated_at:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  models.UserProfile:
    properties:
      avatar:
        type: string
      bio:
        type: string
      class:
        type: string
      created_at:
        type: string
      email:
        type: string
      grade:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      major:
        type: string
      real_name:
        type: string
      role:
        $ref: '#/definitions/models.UserRole'
      school:
        type: string
      student_id:
        type: string
      username:
        type: string
    type: object
  models.UserRole:
    enum:
    - admin
    - teacher
    - student
    - contest
    type: string
    x-enum-comments:
      RoleAdmin: 系统管理员
      RoleContest: 竞赛发起者
      RoleStudent: 学生
      RoleTeacher: 老师
    x-enum-descriptions:
    - 系统管理员
    - 老师
    - 学生
    - 竞赛发起者
    x-enum-varnames:
    - RoleAdmin
    - RoleTeacher
    - RoleStudent
    - RoleContest
  service.RunCodeRequest:
    properties:
      code:
        type: string
      input:
        description: 自定义输入（可选）
        type: string
      language:
        type: string
    required:
    - code
    - language
    type: object
host: localhost:8080
info:
  contact: {}
  description: ZK Code Arena 在线编程平台API文档
  title: ZK Code Arena API
  version: "1.0"
paths:
  /courses:
    post:
      consumes:
      - application/json
      description: 教师创建新课程
      parameters:
      - description: 课程信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateCourseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，返回课程ID
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建课程（教师）
      tags:
      - 课程
    put:
      consumes:
      - application/json
      description: 更新课程的基本信息
      parameters:
      - description: 更新的课程信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateCourseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新课程信息
      tags:
      - 课程
  /courses/{courseId}:
    delete:
      consumes:
      - application/json
      description: 删除指定课程
      parameters:
      - description: 课程ID
        in: path
        name: courseId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除课程
      tags:
      - 课程
    get:
      consumes:
      - application/json
      description: 根据课程ID获取课程详细信息
      parameters:
      - description: 课程ID
        in: path
        name: courseId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 课程详情
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取课程详情
      tags:
      - 课程
  /courses/{courseId}/{clazzId}:
    put:
      consumes:
      - application/json
      description: 刷新班级的邀请二维码
      parameters:
      - description: 课程ID
        in: path
        name: courseId
        required: true
        type: string
      - description: 班级ID
        in: path
        name: clazzId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 刷新班级二维码
      tags:
      - 课程
  /courses/{courseId}/avatar:
    put:
      consumes:
      - multipart/form-data
      description: 上传并更新课程头像图片
      parameters:
      - description: 课程ID
        in: path
        name: courseId
        required: true
        type: string
      - description: 头像文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新课程头像
      tags:
      - 课程
  /courses/{courseId}/clazzes:
    get:
      consumes:
      - application/json
      description: 根据课程ID获取该课程的所有班级列表
      parameters:
      - description: 课程ID
        in: path
        name: courseId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 班级列表
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取课程的所有班级
      tags:
      - 课程
  /courses/clazzes:
    post:
      consumes:
      - application/json
      description: 为指定课程创建新班级
      parameters:
      - description: 班级信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateClazzRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 为课程创建班级
      tags:
      - 课程
    put:
      consumes:
      - application/json
      description: 更新班级的基本信息（不包括教师和成员）
      parameters:
      - description: 班级ID
        in: path
        name: clazzId
        required: true
        type: string
      - description: 更新的班级信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateClazzRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新班级信息
      tags:
      - 课程
  /courses/clazzes/{clazzId}:
    delete:
      consumes:
      - application/json
      description: 删除指定班级
      parameters:
      - description: 班级ID
        in: path
        name: clazzId
        required: true
