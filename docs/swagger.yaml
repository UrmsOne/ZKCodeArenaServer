host: localhost:8080
info:
  contact:
    email: support@zkcodearena.com
    name: API Support
    url: http://localhost/support
  description: |-
    ZK Code Arena 在线编程平台 REST API 文档
    提供用户管理、题库管理、班级课程管理、代码评测等功能
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://localhost/terms/
  title: ZK Code Arena API
  version: "1.0"
paths:
  /admin/problems:
    get:
      consumes:
      - application/json
      description: 管理员端获取题目列表，可查看所有题目包括私有和草稿状态，支持按难度、标签筛选
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 难度
        enum:
        - easy
        - medium
        - hard
        in: query
        name: difficulty
        type: string
      - collectionFormat: csv
        description: 标签列表
        in: query
        items:
          type: string
        name: tags
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: 题目列表
          schema:
            allOf:
            - $ref: '#/definitions/zk-code-arena-server_pkg_utils.Response'
            - properties:
                data:
                  properties:
                    page:
                      type: integer
                    page_size:
                      type: integer
                    problems:
                      items:
                        $ref: '#/definitions/zk-code-arena-server_pkg_models.Problem'
                      type: array
                    total:
                      format: int64
                      type: integer
                    total_page:
                      format: int64
                      type: integer
                  type: object
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
        "401":
          description: 未授权访问
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
        "500":
          description: 获取失败
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取题目列表（管理员端）
      tags:
      - 题目
  /clazzes:
    post:
      consumes:
      - application/json
      description: 创建新班级
      parameters:
      - description: 班级信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/zk-code-arena-server_pkg_models.CreateClazzRequest'
      produces:
