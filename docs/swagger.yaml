              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/zk-code-arena-server_pkg_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建班级
      tags:
      - 班级
    put:
      consumes:
      - application/json
      description: 更新班级的基本信息（不包括教师和成员）
